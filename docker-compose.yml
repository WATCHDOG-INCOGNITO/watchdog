version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: bugbounty_agent
      POSTGRES_USER: bugbounty
      POSTGRES_PASSWORD: bugbounty123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bugbounty -d bugbounty_agent"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend/backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DJANGO_SECRET_KEY: "change-this-in-production"
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: "*"
      DB_NAME: ${DB_NAME:-bugbounty_agent}
      DB_USER: ${DB_USER:-bugbounty}
      DB_PASSWORD: ${DB_PASSWORD:-bugbounty123}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
      VOYAGE_API_KEY: "${VOYAGE_API_KEY:-}"
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      GCS_BUCKET_NAME: ${GCS_BUCKET_NAME:-}
      # white-box CTF source 디렉터리. tools_source가 이 안만 안전 접근.
      # 절대 for_organizer/exploit 디렉터리는 mount하지 말 것 (정답/flag 노출).
      SOURCE_ROOTS: "/sources"
    volumes:
      - ./gcp-key1.json:/app/gcp-key1.json:ro
      # CTF source mount (read-only) — 참가자가 받는 for_user 만 노출.
      # 새 문제 추가 시 같은 패턴으로 한 줄씩 추가.
      - ./codegate2023-fin/general/web-warmup/prob/for_user:/sources/codegate2023/web-warmup:ro
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"

  mcp:
    build: ./backend/backend
    restart: unless-stopped
    ports:
      - "8889:8889"
    environment:
      DJANGO_SECRET_KEY: "change-this-in-production"
      DJANGO_DEBUG: "1"
      DB_NAME: ${DB_NAME:-bugbounty_agent}
      DB_USER: ${DB_USER:-bugbounty}
      DB_PASSWORD: ${DB_PASSWORD:-bugbounty123}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      VOYAGE_API_KEY: "${VOYAGE_API_KEY:-}"
      MCP_SSE: "1"
    depends_on:
      db:
        condition: service_healthy
    command: "python -m watchdog_mcp.server --sse"

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
