version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: bugbounty_agent
      POSTGRES_USER: bugbounty
      POSTGRES_PASSWORD: bugbounty123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bugbounty -d bugbounty_agent"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend/backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DJANGO_SECRET_KEY: "change-this-in-production"
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: "*"
      DB_NAME: ${DB_NAME:-bugbounty_agent}
      DB_USER: ${DB_USER:-bugbounty}
      DB_PASSWORD: ${DB_PASSWORD:-bugbounty123}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
      # 모든 secret(VOYAGE/GCP key 등)은 host의 ./secrets/ 폴더 한 곳에 모음.
      # backend entrypoint 가 /run/secrets/voyage.key 가 있으면 VOYAGE_API_KEY 자동 export.
      VOYAGE_API_KEY: "${VOYAGE_API_KEY:-}"
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-/run/secrets/gcp-key.json}
      GCS_BUCKET_NAME: ${GCS_BUCKET_NAME:-watchdog-evidence}
      # Multi-agent swarm 설정
      WATCHDOG_AGENT_MODE: "${WATCHDOG_AGENT_MODE:-swarm}"
      WATCHDOG_SWARM_EXECUTORS: "${WATCHDOG_SWARM_EXECUTORS:-3}"
      WATCHDOG_SWARM_VERIFIERS: "${WATCHDOG_SWARM_VERIFIERS:-2}"
      WATCHDOG_SWARM_QUIESCENCE_S: "${WATCHDOG_SWARM_QUIESCENCE_S:-30}"
      WATCHDOG_SWARM_MAX_HYPOTHESES: "${WATCHDOG_SWARM_MAX_HYPOTHESES:-20}"
      # white-box CTF source 디렉터리. tools_source가 이 안만 안전 접근.
      # 전체 대회 mount + tools_source의 for_user 경로 필수 검사 + 차단 토큰으로 정답 노출 차단.
      SOURCE_ROOTS: "/sources"
    volumes:
      # 모든 secret 한 폴더에 모음 (host: ./secrets, container: /run/secrets, read-only)
      - ./secrets:/run/secrets:ro
      # CTF 대회 디렉터리 bulk mount (read-only). tools_source가 for_user 경로만 허용 +
      # for_organizer/exploit/flag/README/info.yaml/anticheat 차단. 이중 안전망.
      - ./codegate2023-fin:/sources/codegate2023-fin:ro
      - ./codegate2024-final:/sources/codegate2024-final:ro
      - ./codegate2025-final:/sources/codegate2025-final:ro
      - ./codegate2026-pre:/sources/codegate2026-pre:ro
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "
      [ -z \"$$VOYAGE_API_KEY\" ] && [ -f /run/secrets/voyage.key ] &&
        export VOYAGE_API_KEY=\"$$(tr -d '[:space:]' < /run/secrets/voyage.key)\";
      python manage.py migrate --noinput &&
      python manage.py runserver 0.0.0.0:8000"

  mcp:
    build: ./backend/backend
    restart: unless-stopped
    ports:
      - "8889:8889"
    volumes:
      - ./secrets:/run/secrets:ro
    environment:
      DJANGO_SECRET_KEY: "change-this-in-production"
      DJANGO_DEBUG: "1"
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcp-key.json
      DB_NAME: ${DB_NAME:-bugbounty_agent}
      DB_USER: ${DB_USER:-bugbounty}
      DB_PASSWORD: ${DB_PASSWORD:-bugbounty123}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      VOYAGE_API_KEY: "${VOYAGE_API_KEY:-}"
      MCP_SSE: "1"
    depends_on:
      db:
        condition: service_healthy
    command: "python -m watchdog_mcp.server --sse"

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
