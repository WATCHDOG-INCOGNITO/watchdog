services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: bugbounty_agent
      POSTGRES_USER: bugbounty
      POSTGRES_PASSWORD: bugbounty123
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bugbounty -d bugbounty_agent"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - test_pg_data:/var/lib/postgresql/data

  backend:
    build: ./backend/backend
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"]
    environment:
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,0.0.0.0"
      DJANGO_SECRET_KEY: "test-only"
      DB_NAME: bugbounty_agent
      DB_USER: bugbounty
      DB_PASSWORD: bugbounty123
      DB_HOST: db
      DB_PORT: "5432"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
      VOYAGE_API_KEY: "${VOYAGE_API_KEY:-}"
    ports:
      - "8000:8000"

  wargame:
    build: ./docker/wargame
    ports:
      - "5000:5000"

volumes:
  test_pg_data:
