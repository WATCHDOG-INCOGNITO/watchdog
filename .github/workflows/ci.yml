name: CI

on:
  pull_request:
  push:

permissions:
  contents: read
  actions: write

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Secret scan (gitleaks OSS)
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            zricethezav/gitleaks:v8.24.2 \
            git --no-banner --redact --verbose

      - name: Build image (backend)
        run: docker build -t local/backend:ci -f backend/backend/Dockerfile backend/backend

      - name: Trivy image scan (fail on HIGH/CRITICAL)
        # The legacy 0.24.0 tag was removed; pin the restored v0.24.0 release immutably.
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8
        with:
          image-ref: local/backend:ci
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: true

      - name: Generate SBOM (syft, SPDX-JSON)
        run: |
          mkdir -p dist
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock anchore/syft:v1.42.0 local/backend:ci -o spdx-json > dist/backend.sbom.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-backend-spdx-json
          path: dist/backend.sbom.spdx.json

      - name: E2E Smoke (local compose)
        run: |
          docker compose -f docker/docker-compose.e2e.yml up -d --build
          python3 docker/e2e/smoke.py --base-url http://localhost:8000 --target-url http://test-target:8080 --timeout 60

      - name: E2E Teardown
        if: always()
        run: docker compose -f docker/docker-compose.e2e.yml down -v
